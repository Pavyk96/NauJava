spring:
  application:
    name: NauJava
  datasource:
    url: jdbc:postgresql://localhost:5432/project
    username: project
    password: project
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

app:
  name: Bank Console App
  version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
