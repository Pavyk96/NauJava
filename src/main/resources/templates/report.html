<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .meta {
            margin-bottom: 24px;
            color: #475569;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #f8fafc;
            border: 1px solid #dbe4f0;
            border-radius: 12px;
            padding: 16px;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                margin: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Отчет приложения</h1>
    <div class="meta">
        <div><strong>ID отчета:</strong> <span th:text="${report.id}"></span></div>
        <div><strong>Статус:</strong> <span th:text="${report.status}"></span></div>
    </div>
    <pre th:text="${report.content}"></pre>
</div>
</body>
</html>
